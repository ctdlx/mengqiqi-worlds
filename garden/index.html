  :root{
    --bg:#F3EDDE;
    --paper:#FFFDF7;
    --ink:#35402F;
    --muted:#6D7A61;
    --olive:#5D6C50;
    --sage:#96A585;
    --blush:#D8A6A0;
    --butter:#E7C978;
    --gold:#B08A4F;
    --serif:'Wish Serif','Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC',serif;
    --sans:'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  .stage{
    position:relative;width:100%;height:100vh;height:100svh;height:100dvh;
    overflow:hidden;display:flex;justify-content:center;isolation:isolate;
  }

  /* ---------------- garden backdrop ---------------- */
  .bg{
    position:absolute;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(62% 52% at 18% 0%,rgba(255,250,231,.95) 0%,rgba(255,250,231,0) 62%),
      radial-gradient(50% 40% at 88% 16%,rgba(220,233,214,.55) 0%,rgba(220,233,214,0) 70%),
      linear-gradient(180deg,#F6F0E1 0%,#F0ECDD 38%,#E7EBDD 66%,#D6E0CC 100%);
  }

  .sunbeam{
    position:absolute;z-index:0;top:-22%;left:-10%;width:74%;height:110%;
    background:linear-gradient(122deg,rgba(255,249,226,.8) 0%,rgba(255,249,226,.18) 38%,rgba(255,249,226,0) 68%);
    transform:rotate(-8deg);
    mix-blend-mode:soft-light;
    pointer-events:none;
    animation:sunbreathe 14s ease-in-out infinite;
  }
  @keyframes sunbreathe{
    0%,100%{opacity:.65;transform:rotate(-8deg) scale(1);}
    50%{opacity:.9;transform:rotate(-6deg) scale(1.03);}
  }

  .garden-arch{
    position:absolute;z-index:1;left:-8%;bottom:-4%;width:116%;height:84%;
    pointer-events:none;opacity:.72;
  }
  .garden-arch svg{display:block;width:100%;height:100%;}

  .wisteria{
    position:absolute;z-index:2;top:-2%;width:150px;pointer-events:none;
    transform-origin:50% 0;
    animation:wisteriaSway 11s ease-in-out infinite;
  }
  .wisteria.w1{left:-16px;}
  .wisteria.w2{right:-22px;transform:scaleX(-1);animation-delay:-4s;}
  @keyframes wisteriaSway{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2.5deg);}
  }

  .dappled{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  .dapple{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(255,249,218,.55) 0%,rgba(255,249,218,0) 70%);
    filter:blur(6px);
    animation:dappleDrift var(--dur,18s) ease-in-out infinite alternate;
  }
  @keyframes dappleDrift{
    from{transform:translate3d(0,0,0) scale(1);opacity:.5;}
    to{transform:translate3d(12px,8px,0) scale(1.08);opacity:.85;}
  }

  .garden-bed{
    position:absolute;z-index:2;left:-12%;right:-12%;bottom:-7%;height:28vh;
    pointer-events:none;
    background:
      radial-gradient(ellipse at 16% 92%,rgba(107,130,89,.42) 0%,rgba(107,130,89,0) 58%),
      radial-gradient(ellipse at 84% 96%,rgba(124,146,104,.38) 0%,rgba(124,146,104,0) 60%),
      radial-gradient(ellipse at 50% 102%,rgba(94,116,78,.25) 0%,rgba(94,116,78,0) 64%);
    filter:blur(11px);
  }

  .vignette{
    position:absolute;inset:0;z-index:3;pointer-events:none;
    box-shadow:inset 0 0 150px rgba(66,83,54,.12);
  }

  #petals{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden;}
  .petal{
    position:absolute;width:9px;height:14px;
    border-radius:60% 40% 55% 45% / 55% 45% 55% 45%;
    background:linear-gradient(140deg,#F5D6CF,#DCA7A0);
    opacity:.8;
    animation:petalFall var(--dur,12s) linear infinite;
    animation-delay:var(--delay,0s);
    transform-origin:50% 50%;
  }
  @keyframes petalFall{
    0%{opacity:0;transform:translate3d(0,-40px,0) rotate(0deg);}
    10%{opacity:.75;}
    100%{opacity:0;transform:translate3d(var(--drift,30px),105vh,0) rotate(320deg);}
  }

  .butterfly{
    position:absolute;z-index:7;width:32px;height:24px;pointer-events:none;
    filter:drop-shadow(0 0 7px rgba(255,241,214,.85));
    animation:bfFly var(--dur,10s) ease-in-out infinite;
  }
  .butterfly svg,.fx-butterfly svg{display:block;width:100%;height:100%;overflow:visible;}
  @keyframes bfFly{
    0%,100%{transform:translate3d(0,0,0) rotate(-6deg);}
    30%{transform:translate3d(16px,-12px,0) rotate(6deg);}
    65%{transform:translate3d(-8px,-22px,0) rotate(-4deg);}
  }

  /* ---------------- scene ---------------- */
  .scene{
    position:relative;z-index:10;width:100%;max-width:620px;min-height:100%;
    padding:calc(18px + env(safe-area-inset-top)) 22px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
  }
  .topbar{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;
    color:#78856B;font-family:var(--serif);font-size:8px;font-weight:400;
    letter-spacing:.34em;text-transform:uppercase;
    opacity:0;animation:fadeIn 1.2s var(--ease) .2s forwards;
  }
  .topbar .brand{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .topbar .brand::before{
    content:"";width:4px;height:4px;border:1px solid #94A383;
    transform:rotate(45deg);opacity:.9;
  }
  .topbar .edition{white-space:nowrap;}
  @keyframes fadeIn{to{opacity:1;}}

  /* ---------------- card ---------------- */
  .card{
    position:relative;z-index:8;width:min(84vw,350px);
    margin-top:clamp(82px,10.8vh,106px);
    padding:24px 30px 25px;
    background:linear-gradient(176deg,#FFFDF7 0%,#FCF8EC 62%,#F6F1E0 100%);
    border:1px solid rgba(141,158,124,.62);
    box-shadow:
      0 36px 70px -26px rgba(64,81,53,.38),
      0 10px 24px rgba(64,81,53,.08),
      inset 0 1px 0 rgba(255,255,255,.9);
    color:var(--ink);text-align:center;
    opacity:0;transform:translateY(20px) scale(.985);
    animation:cardIn 1.35s var(--ease) .35s forwards;
  }
  @keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}

  .card::before{
    content:"";position:absolute;inset:7px;
    border:1px solid rgba(141,158,124,.24);pointer-events:none;
  }
  .card::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(126deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%);
    pointer-events:none;
  }

  }
  .corner{
    position:absolute;z-index:3;width:16px;height:16px;
    border-color:rgba(118,136,102,.55);border-style:solid;pointer-events:none;
  }
  .c-tl{top:14px;left:14px;border-width:1px 0 0 1px;}
  .c-tr{top:14px;right:14px;border-width:1px 1px 0 0;}
  .c-bl{bottom:14px;left:14px;border-width:0 0 1px 1px;}
  .c-br{bottom:14px;right:14px;border-width:0 1px 1px 0;}

  .card-vine{
    position:absolute;z-index:4;width:68px;height:68px;color:#8FA07E;
    opacity:.62;pointer-events:none;overflow:visible;
  }
  .card-vine.v1{left:-17px;top:-15px;transform:rotate(-16deg);}
  .card-vine.v2{right:-17px;bottom:-15px;transform:rotate(164deg);}

  .content{position:relative;z-index:2;}

  .pressed{
    width:28px;height:28px;margin:0 auto 7px;color:#C98980;
    opacity:0;transform:scale(.6) rotate(-12deg);
    animation:pressedIn .9s var(--ease) 1.05s forwards;
  }
  .pressed svg{display:block;width:100%;height:100%;}
  @keyframes pressedIn{to{opacity:1;transform:scale(1) rotate(0);}}
  .pressed.bloom{animation:pressedBloom 1.1s var(--ease) forwards;}
  @keyframes pressedBloom{
    0%{transform:scale(1) rotate(0);}
    45%{transform:scale(1.28) rotate(9deg);}
    100%{transform:scale(1.08) rotate(3deg);}
  }

  .wish-title{margin:0;display:flex;flex-direction:column;align-items:center;font-family:var(--serif);}
  .name{
    margin:0;font-size:25px;font-weight:650;line-height:1.2;
    letter-spacing:.25em;text-indent:.25em;
    color:#A67758;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.85));
    opacity:0;animation:fadeIn 1s var(--ease) .9s forwards;
  }
  .title{
    display:flex;justify-content:center;gap:.055em;margin:7px 0 0;
    font-size:clamp(48px,14.4vw,66px);font-weight:650;line-height:1.08;
    letter-spacing:.015em;color:#34412F;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
  }
  .ch{
    display:inline-block;opacity:0;transform:translateY(13px);
    animation:titleIn 1.05s var(--ease) forwards;
    animation-delay:calc(1s + var(--i) * .09s);
  }
  @keyframes titleIn{to{opacity:1;transform:translateY(0);}}

  .divider{
    display:flex;align-items:center;justify-content:center;gap:8px;height:20px;margin-top:7px;
    opacity:0;animation:fadeIn .9s ease 1.5s forwards;
  }
  .divider::before,.divider::after{
    content:"";width:42px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(118,136,102,.6));
  }
  .divider::after{background:linear-gradient(90deg,rgba(118,136,102,.6),transparent);}
  .divider i{
    width:5px;height:5px;border:1px solid rgba(118,136,102,.9);transform:rotate(45deg);
  }

  .wish{
    margin:0;font-family:var(--serif);font-size:12.8px;font-weight:400;
    line-height:2.05;letter-spacing:.12em;color:var(--muted);
    opacity:0;animation:fadeIn 1.15s ease 1.58s forwards;
  }

  .receive{
    position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    margin-top:15px;padding:7px 2px 6px;border:0;border-bottom:1px solid rgba(118,136,102,.45);
    background:transparent;color:#758467;font-family:var(--serif);font-size:10.5px;
    font-weight:400;letter-spacing:.14em;cursor:pointer;
    opacity:0;animation:fadeIn 1s ease 1.82s forwards;
    transition:color .35s ease,border-color .35s ease;
  }
  .receive::before{
    content:"";width:4px;height:4px;border:1px solid currentColor;transform:rotate(45deg);
    animation:pulseDot 2.8s ease-in-out infinite;
  }
  .receive::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:#9AA98A;
    transform:scaleX(0);transform-origin:50% 50%;transition:transform .5s var(--ease);
  }
  .receive:hover::after,.receive.tapped::after{transform:scaleX(1);}
  .receive.tapped{color:#B47860;border-color:rgba(180,120,96,.3);}
  @keyframes pulseDot{
    0%,100%{opacity:.45;transform:rotate(45deg) scale(.8);}
    50%{opacity:1;transform:rotate(45deg) scale(1);}
  }
  .receive .btn-text{display:inline-block;transition:opacity .25s ease,transform .25s ease;}
  .receive.swap .btn-text{opacity:0;transform:translateY(4px);}

  /* ---------------- character ---------------- */
  .character{
    position:relative;z-index:6;width:min(88vw,370px,44vh);
    margin-top:auto;margin-bottom:14px;
    opacity:0;transform:translateY(28px);
    animation:charIn 1.65s var(--ease) .55s forwards;
  }
  @keyframes charIn{to{opacity:1;transform:translateY(0);}}
  .char-inner{
    position:relative;width:100%;transform-origin:50% 100%;
    animation:charFloat 7.5s ease-in-out 2.1s infinite;
  }
  @keyframes charFloat{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-5px) rotate(.2deg);}
  }
  .char-inner.pulse{animation:charPulse .95s var(--ease);}
  @keyframes charPulse{
    0%{transform:translateY(0) scale(1);}
    35%{transform:translateY(-4px) scale(1.015);}
    70%{transform:translateY(0) scale(.998);}
    100%{transform:translateY(0) scale(1);}
  }

  .halo{
    position:absolute;z-index:-1;left:50%;top:42%;width:80%;aspect-ratio:1;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,236,180,.5) 0%,rgba(255,236,180,.14) 44%,rgba(255,236,180,0) 70%);
    filter:blur(20px);animation:haloBreathe 7s ease-in-out infinite;
  }
  @keyframes haloBreathe{
    0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.72;}
    50%{transform:translate(-50%,-50%) scale(1.05);opacity:1;}
  }

  .character img{
    position:relative;z-index:2;display:block;width:100%;height:auto;
    filter:drop-shadow(0 28px 30px rgba(64,81,53,.24)) drop-shadow(0 0 26px rgba(255,214,130,.16));
  }
  .char-shadow{
    position:absolute;z-index:0;left:50%;bottom:1%;
    width:58%;height:18px;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,rgba(53,64,47,.32) 0%,rgba(53,64,47,.12) 48%,rgba(53,64,47,0) 72%);
    filter:blur(5px);animation:shadowBreathe 7.5s ease-in-out 2.1s infinite;
  }
  @keyframes shadowBreathe{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.9;}
    50%{transform:translateX(-50%) scale(.94);opacity:.65;}
  }

  .flowers-at-feet{
    position:absolute;z-index:3;left:50%;bottom:-3%;width:112%;transform:translateX(-50%);
    pointer-events:none;
  }
  .flowers-at-feet svg{display:block;width:100%;height:auto;overflow:visible;}

  .butterfly.bf1{left:1%;top:18%;--dur:12s;}
  .butterfly.bf2{right:1%;top:21%;width:28px;height:21px;--dur:15s;animation-delay:-4s;}

  .hand-flower{
    position:absolute;z-index:4;left:17%;top:23%;width:30px;height:52px;
    transform-origin:50% 100%;
    animation:handFlowerSway 6s ease-in-out infinite;
    pointer-events:none;
  }
  .hand-flower .stem{
    position:absolute;left:50%;bottom:0;width:1px;height:33px;
    background:linear-gradient(rgba(104,124,86,.95),rgba(104,124,86,0));
    transform:translateX(-50%);
  }
  .hand-flower .leaf{
    position:absolute;left:54%;bottom:12px;width:9px;height:5px;
    border-radius:80% 20% 80% 20%;
    background:#8FA07E;transform:rotate(-28deg);opacity:.85;
  }
  .hand-flower .bloom{
    position:absolute;left:50%;top:0;width:30px;height:30px;
    transform:translateX(-50%);
  }
  .hand-flower .bloom i{
    position:absolute;left:50%;top:50%;width:10px;height:14px;
    margin:-14px 0 0 -5px;border-radius:50%;
    background:linear-gradient(180deg,#FFFDF5,#F5DCD2);
    border:1px solid rgba(201,176,139,.55);
    transform-origin:50% 100%;
  }
  .hand-flower .bloom i:nth-child(2){transform:rotate(72deg);}
  .hand-flower .bloom i:nth-child(3){transform:rotate(144deg);}
  .hand-flower .bloom i:nth-child(4){transform:rotate(216deg);}
  .hand-flower .bloom i:nth-child(5){transform:rotate(288deg);}
  .hand-flower .core{
    position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
    border-radius:50%;background:#E4BE62;box-shadow:0 0 5px rgba(228,190,98,.5);
  }
  @keyframes handFlowerSway{
    0%,100%{transform:rotate(-2deg) translateY(0);}
    50%{transform:rotate(2.5deg) translateY(-3px);}
  }

  .credit{
    position:fixed;z-index:11;left:50%;bottom:calc(5px + env(safe-area-inset-bottom));
    transform:translateX(-50%);color:rgba(75,89,64,.42);font-size:7px;
    letter-spacing:.05em;white-space:nowrap;pointer-events:none;
  }

  /* ---------------- effects ---------------- */
  .fx-layer{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden;}
  .fx-petal{
    position:absolute;width:9px;height:14px;border-radius:60% 40% 55% 45% / 55% 45% 55% 45%;
    background:linear-gradient(140deg,#F7DCD3,#D89D95);
    opacity:.9;animation:fxPetal 3.4s ease-out forwards;
  }
  @keyframes fxPetal{
    0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.6);}
    15%{opacity:.95;}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,30px)),calc(-50% + 150px)) rotate(220deg) scale(1);}
  }
  .fx-butterfly{
    position:absolute;width:24px;height:20px;pointer-events:none;
    animation:fxBf 4s ease-out forwards;
  }
  @keyframes fxBf{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
    15%{opacity:1;}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,40px)),calc(-50% - 120px)) scale(1) rotate(8deg);}
  }
  .ripple-layer{position:fixed;inset:0;z-index:29;pointer-events:none;overflow:hidden;}
  .ripple{
    position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;
    border:1px solid rgba(168,143,96,.5);border-radius:50%;
    animation:rippleOut 1s var(--ease) forwards;
  }
  @keyframes rippleOut{0%{opacity:.8;transform:scale(.4);}100%{opacity:0;transform:scale(9);}}

  /* ---------------- responsive ---------------- */
  @media (max-height:800px) and (min-height:601px){
    .card{margin-top:clamp(56px,8vh,76px);padding:22px 26px 22px;}
    .title{font-size:clamp(46px,13vw,58px);}
    .character{width:min(86vw,345px,42vh);}
  }
  @media (max-height:740px){
    .card{margin-top:40px;padding:20px 22px 20px;}
    .name{font-size:22px;}
    .title{font-size:clamp(42px,13.6vw,54px);}
    .wish{font-size:11.8px;line-height:1.95;}
    .receive{margin-top:12px;}
    .character{width:min(84vw,320px,41vh);margin-bottom:12px;}
    .wisteria{width:120px;}
  }
  @media (max-height:620px){
    .topbar{font-size:7px;}
    .card{margin-top:40px;padding:17px 20px 17px;}
    .pressed{width:23px;height:23px;margin-bottom:4px;}
    .name{font-size:20px;}
    .title{font-size:clamp(37px,12.4vw,48px);}
    .wish{font-size:10.8px;line-height:1.85;letter-spacing:.1em;}
    .divider{height:16px;margin-top:4px;}
    .receive{margin-top:9px;font-size:9.5px;}
    .character{width:min(78vw,285px,39vh);margin-bottom:10px;}
    .credit{font-size:6.5px;}
  }
  @media (max-height:540px){
    .card{margin-top:34px;padding:14px 18px 14px;}
    .title{font-size:clamp(34px,11.4vw,43px);}
    .wish{line-height:1.7;}
    .character{width:min(72vw,250px,36vh);}
  }
  @media (min-width:720px) and (min-height:820px){
    .card{width:380px;margin-top:100px;}
    .character{width:min(400px,46vh);}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
    .topbar,.card,.pressed,.name,.ch,.divider,.wish,.receive,.character{opacity:1 !important;transform:none !important;}
    .fx-layer{display:none;}
  }
</style>

      p.style.top = (-8 - Math.random()*30) + '%';
      p.style.setProperty('--dur', (10 + Math.random()*8).toFixed(1) + 's');
      p.style.setProperty('--delay', (-Math.random()*18).toFixed(1) + 's');
      p.style.setProperty('--drift', (-40 + Math.random()*80).toFixed(0) + 'px');
      p.style.opacity = (.4 + Math.random()*.4).toFixed(2);
      petalsLayer.appendChild(p);
    }
  }

  function ripple(x,y){
    var r = document.createElement('span');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    rippleLayer.appendChild(r);
    setTimeout(function(){ r.remove(); }, 1050);
  }

  function petalBurst(x,y,n){
    if(reduced) return;
    for(var i=0;i<n;i++){
      var p = document.createElement('span');
      p.className = 'fx-petal';
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.setProperty('--dx', (-90 + Math.random()*180).toFixed(0) + 'px');
      p.style.animationDelay = (i*30) + 'ms';
      fxLayer.appendChild(p);
      setTimeout(function(el){ return function(){ el.remove(); }; }(p), 3800);
    }
  }

  function butterflyAt(x,y){
    if(reduced) return;
    var b = document.createElement('div');
    b.className = 'fx-butterfly';
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.setProperty('--dx', (-60 + Math.random()*120).toFixed(0) + 'px');
    b.innerHTML = '<svg viewBox="0 0 32 24" fill="none"><path d="M16 12 C10 3 3 3 2 8 C1 13 7 18 16 12Z" fill="#D9A6A0" stroke="#FFF6EC" stroke-width=".8"/><path d="M16 12 C22 3 29 3 30 8 C31 13 25 18 16 12Z" fill="#D9A6A0" stroke="#FFF6EC" stroke-width=".8"/><path d="M16 7 C14 4 12 3 10 2 M16 7 C18 4 20 3 22 2" stroke="#6B5A47" stroke-width=".8" stroke-linecap="round"/><path d="M16 7 V17" stroke="#6B5A47" stroke-width="1.2" stroke-linecap="round"/></svg>';
    fxLayer.appendChild(b);
    setTimeout(function(){ b.remove(); }, 4200);
  }

  var tapped = false;
  function tap(x,y,isButton){
    ripple(x,y);
    petalBurst(x,y,isButton ? 16 : 5);
    if(isButton){ butterflyAt(x,y); butterflyAt(x + 30,y + 20); }
    if(!reduced){
      charInner.classList.remove('pulse');
      void charInner.offsetWidth;
      charInner.classList.add('pulse');
      setTimeout(function(){ charInner.classList.remove('pulse'); }, 1000);
    }
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }

    if(!tapped){
      tapped = true;
      pressed.classList.add('bloom');
      receive.classList.add('swap');
      setTimeout(function(){
        btnText.textContent = '花开啦';
        receive.classList.remove('swap');
        receive.classList.add('tapped');
      }, 240);
    }
  }

  stage.addEventListener('pointerdown', function(e){
    if(e.button && e.button !== 0) return;
    tap(e.clientX, e.clientY, !!e.target.closest('.receive'));
  }, {passive:true});

  receive.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      var r = receive.getBoundingClientRect();
      tap(r.left + r.width/2, r.top + r.height/2, true);
    }
  });
})();
</script>
</body>
</html>
