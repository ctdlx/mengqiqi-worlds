  :root{
    --night:#08111F;
    --night-2:#0E1B2D;
    --night-3:#1A2B43;
    --paper:#FCF7EC;
    --ink:#33291F;
    --muted:#796653;
    --gold:#D0AC72;
    --gold-soft:#E8D3AA;
    --ember:#C67B56;
    --cream:#F7E9C9;
    --serif:'Wish Serif','Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC',serif;
    --sans:'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    color:var(--cream);
    background:var(--night);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100svh;
    height:100dvh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    isolation:isolate;
  }

  /* ---------------- night sky ---------------- */
  .sky{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
      radial-gradient(90% 62% at 50% 104%,rgba(217,153,93,.34) 0%,rgba(217,153,93,.1) 34%,rgba(217,153,93,0) 66%),
      radial-gradient(60% 50% at 82% 10%,rgba(93,127,151,.22) 0%,rgba(93,127,151,0) 68%),
      linear-gradient(180deg,#060D19 0%,#0B1627 28%,#132139 54%,#203047 76%,#3A3B44 91%,#59463C 100%);
  }

  .aurora{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    pointer-events:none;
    opacity:.28;
  }
  .aurora.a1{
    width:80vw;height:48vh;
    left:-24vw;top:14vh;
    background:linear-gradient(120deg,rgba(92,157,153,.45),rgba(79,102,154,.22));
    transform:rotate(-18deg);
    animation:auroraDrift 22s ease-in-out infinite alternate;
  }
  .aurora.a2{
    width:72vw;height:38vh;
    right:-28vw;top:38vh;
    background:linear-gradient(120deg,rgba(185,127,151,.3),rgba(70,106,137,.22));
    transform:rotate(16deg);
    animation:auroraDrift 27s ease-in-out infinite alternate-reverse;
  }
  @keyframes auroraDrift{
    from{transform:translate3d(-3%,0,0) rotate(-18deg);}
    to{transform:translate3d(4%,3%,0) rotate(-14deg);}
  }

  .moon{
    position:absolute;
    z-index:2;
    top:6.5vh;
    right:7vw;
    width:clamp(86px,24vw,148px);
    aspect-ratio:1;
    filter:drop-shadow(0 0 26px rgba(247,226,184,.32));
    opacity:0;
    animation:moonRise 2.6s var(--ease) .25s forwards;
  }
  .moon svg{display:block;width:100%;height:100%;overflow:visible;}
  .moon::before{
    content:"";
    position:absolute;
    inset:-70%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(247,226,184,.18) 0%,rgba(247,226,184,.06) 36%,rgba(247,226,184,0) 68%);
    pointer-events:none;
  }
  @keyframes moonRise{
    0%{opacity:0;transform:translateY(26px) scale(.92);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }

  .stars{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;}
  .star{
    position:absolute;
    display:block;
    border-radius:50%;
    background:#F7E7C9;
    box-shadow:0 0 6px rgba(247,231,201,.85);
    animation:twinkle var(--dur,4.5s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
    opacity:.3;
  }
  @keyframes twinkle{
    0%,100%{opacity:.18;transform:scale(.7);}
    50%{opacity:.85;transform:scale(1);}
  }
  .spark{
    position:absolute;
    width:10px;height:10px;
    background:#F4DCA9;
    clip-path:polygon(50% 0%,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0% 50%,41% 41%);
    opacity:.35;
    filter:drop-shadow(0 0 6px rgba(244,220,169,.7));
    animation:sparkTwinkle var(--dur,6s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes sparkTwinkle{
    0%,100%{opacity:.16;transform:scale(.7) rotate(0deg);}
    50%{opacity:.6;transform:scale(1) rotate(20deg);}
  }

  .constellation{
    position:absolute;
    z-index:1;
    top:5.2%;
    left:4%;
    width:116px;
    opacity:.55;
    pointer-events:none;
  }

  .clouds{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  .cloud{
    position:absolute;
    border-radius:50%;
    background:rgba(166,188,204,.1);
    filter:blur(18px);
    animation:cloudDrift var(--dur,26s) ease-in-out infinite alternate;
  }
  .cloud.c1{width:78vw;height:15vh;left:-22vw;top:27%;opacity:.8;}
  .cloud.c2{width:70vw;height:12vh;right:-24vw;top:44%;opacity:.55;animation-delay:-8s;}
  .cloud.c3{width:90vw;height:16vh;left:-10vw;bottom:18%;opacity:.45;animation-delay:-14s;}
  @keyframes cloudDrift{
    from{transform:translate3d(-2%,0,0) scale(1);}
    to{transform:translate3d(4%,2%,0) scale(1.05);}
  }

  .shooting{
    position:absolute;
    z-index:3;
    top:8%;
    left:-18%;
    width:150px;
    height:1px;
    background:linear-gradient(90deg,rgba(255,244,210,0),rgba(255,244,210,.95));
    transform:rotate(22deg);
    transform-origin:100% 50%;
    opacity:0;
    pointer-events:none;
    filter:drop-shadow(0 0 6px rgba(255,244,210,.8));
  }
  .shooting::after{
    content:"";
    position:absolute;
    right:-2px;top:-2px;
    width:5px;height:5px;
    border-radius:50%;
    background:#FFF6D8;
    box-shadow:0 0 12px 3px rgba(255,239,196,.85);
  }
  .shooting.run{animation:shoot 1.7s ease-out forwards;}
  @keyframes shoot{
    0%{opacity:0;transform:translate3d(0,0,0) rotate(22deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate3d(80vw,38vh,0) rotate(22deg);}
  }

  .mountains{
    position:absolute;
    z-index:3;
    left:-2%;
    bottom:-1px;
    width:104%;
    height:34vh;
    min-height:210px;
    pointer-events:none;
  }
  .mountains svg{display:block;width:100%;height:100%;}

  .horizon-glow{
    position:absolute;
    z-index:3;
    left:50%;
    bottom:-10vh;
    width:112vw;
    height:54vh;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 64%,rgba(255,207,143,.34) 0%,rgba(255,207,143,.12) 38%,rgba(255,207,143,0) 70%);
    filter:blur(18px);
    pointer-events:none;
  }

  #fireflies{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
  .firefly{
    position:absolute;
    display:block;
    width:3px;height:3px;
    border-radius:50%;
    background:#FFE1A0;
    box-shadow:0 0 8px 2px rgba(255,210,130,.45);
    opacity:0;
    animation:fireflyFloat var(--dur,11s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes fireflyFloat{
    0%,100%{opacity:0;transform:translate3d(0,10px,0) scale(.7);}
    25%{opacity:.75;}
    50%{opacity:.45;transform:translate3d(var(--dx,18px),-18px,0) scale(1);}
    80%{opacity:.55;}
  }

  .grain{
    position:absolute;

  .vignette{
    position:absolute;
    inset:0;
    z-index:5;
    pointer-events:none;
    box-shadow:inset 0 0 170px rgba(0,0,0,.62),inset 0 0 50px rgba(0,0,0,.35);
  }

  /* ---------------- scene ---------------- */
  .scene{
    position:relative;
    z-index:10;
    width:100%;
    max-width:620px;
    min-height:100%;
    padding:calc(18px + env(safe-area-inset-top)) 22px calc(8px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .topbar{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    color:#C7B18F;
    font-family:var(--serif);
    font-size:8px;
    font-weight:400;
    letter-spacing:.34em;
    text-transform:uppercase;
    opacity:0;
    animation:fadeIn 1.2s var(--ease) .2s forwards;
  }
  .topbar .brand{display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .topbar .brand::before{
    content:"";
    width:4px;height:4px;
    border:1px solid rgba(208,172,114,.9);
    transform:rotate(45deg);
    opacity:.8;
  }
  .topbar .edition{white-space:nowrap;}
  @keyframes fadeIn{to{opacity:1;}}

  /* ---------------- letter ---------------- */
  .letter-wrap{
    position:relative;
    z-index:8;
    width:min(85vw,360px);
    margin-top:clamp(84px,11.2vh,108px);
  }
  .letter{
    position:relative;
    z-index:1;
    width:100%;
    padding:26px 30px 30px;
    background:
      linear-gradient(158deg,#1B2E49 0%,#122239 48%,#0C192B 100%);
    border:1px solid rgba(208,172,114,.58);
    box-shadow:
      0 48px 90px -24px rgba(0,0,0,.82),
      0 0 44px rgba(208,172,114,.06),
      inset 0 1px 0 rgba(255,255,255,.1),
      inset 0 -18px 40px rgba(0,0,0,.18);
    color:#EBDDC3;
    text-align:center;
    opacity:0;
    transform:translateY(26px) rotateX(6deg);
    transform-origin:50% 100%;
    animation:letterIn 1.5s var(--ease) .35s forwards;
  }
  @keyframes letterIn{
    0%{opacity:0;transform:translateY(26px) rotateX(6deg) scale(.985);}
    100%{opacity:1;transform:translateY(0) rotateX(0deg) scale(1);}
  }

  .envelope{
    position:absolute;
    z-index:0;
    left:-8px;right:-8px;top:-9px;bottom:9px;
    background:linear-gradient(160deg,#29445F 0%,#1B3049 58%,#14263D 100%);
    border:1px solid rgba(208,172,114,.36);
    box-shadow:0 34px 66px rgba(0,0,0,.55);
    transform:rotate(-2.1deg);
    opacity:0;
    animation:fadeIn 1.2s ease .35s forwards;
  }
  .envelope::before{
    content:"";
    position:absolute;
    left:0;right:0;top:0;
    height:46%;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));
    clip-path:polygon(0 0,100% 0,50% 100%);
    opacity:.6;
  }
  .envelope::after{
    content:"";
    position:absolute;
    left:12px;right:12px;top:12px;bottom:12px;
    border:1px solid rgba(208,172,114,.12);
  }

  .letter::before{
    content:"";
    position:absolute;
    inset:7px;
    border:1px solid rgba(208,172,114,.2);
    pointer-events:none;
  }
  .letter::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(126deg,rgba(255,243,214,.09) 0%,rgba(255,243,214,0) 38%),
      linear-gradient(0deg,rgba(0,0,0,.12),rgba(0,0,0,0) 42%);
    pointer-events:none;
  }

  .corner{
    position:absolute;
    z-index:3;
    width:15px;height:15px;
    border-color:rgba(176,138,79,.56);
    border-style:solid;
    pointer-events:none;
  }
  .c-tl{top:15px;left:15px;border-width:1px 0 0 1px;}
  .c-tr{top:15px;right:15px;border-width:1px 1px 0 0;}
  .c-bl{bottom:15px;left:15px;border-width:0 0 1px 1px;}
  .c-br{bottom:15px;right:15px;border-width:0 1px 1px 0;}

  .content{position:relative;z-index:2;}

  .emblem{
    position:relative;
    width:20px;height:20px;
    margin:0 auto 10px;
    color:var(--gold);
    opacity:0;
    animation:fadeIn .9s ease 1.1s forwards;
  }
  .emblem svg{display:block;width:100%;height:100%;}
  .emblem::after{
    content:"";
    position:absolute;
    left:50%;bottom:-8px;
    width:1px;height:6px;
    background:linear-gradient(var(--gold),transparent);
    opacity:.45;
    transform:translateX(-50%);
  }

  .wish-title{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:var(--serif);
  }

  .name{
    margin:0;
    font-size:26px;
    font-weight:650;
    line-height:1.2;
    letter-spacing:.24em;
    text-indent:.24em;
    background:linear-gradient(180deg,#F0D5A0 0%,#C79A5D 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.32));
    opacity:0;
    animation:fadeIn 1s var(--ease) .95s forwards;
  }

  .title{
    display:flex;
    justify-content:center;
    gap:.055em;
    margin:8px 0 0;
    font-size:clamp(48px,14.6vw,66px);
    font-weight:650;
    line-height:1.08;
    letter-spacing:.01em;
    color:#F4E6CA;
    text-shadow:0 2px 1px rgba(0,0,0,.22),0 0 28px rgba(244,220,169,.14);
  }
  .ch{
    display:inline-block;
    opacity:0;
    transform:translateY(14px);
    animation:titleIn 1.05s var(--ease) forwards;
    animation-delay:calc(1.05s + var(--i) * .09s);
  }
  @keyframes titleIn{
    0%{opacity:0;transform:translateY(14px);}
    100%{opacity:1;transform:translateY(0);}
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:20px;
    margin-top:7px;
    opacity:0;
    animation:fadeIn .9s ease 1.55s forwards;
  }
  .divider::before,.divider::after{
    content:"";
    width:42px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(176,138,79,.55));
  }
  .divider::after{background:linear-gradient(90deg,rgba(176,138,79,.55),transparent);}
  .divider i{
    width:5px;height:5px;
    border:1px solid rgba(176,138,79,.8);
    transform:rotate(45deg);
  }

  .wish{
    margin:0;
    font-family:var(--serif);
    font-size:12.8px;
    font-weight:400;
    line-height:2.05;
    letter-spacing:.12em;
    color:#C9BAA3;
    opacity:0;
    animation:fadeIn 1.15s ease 1.62s forwards;
  }

  .light{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:16px;
    padding:7px 2px 6px;
    border:0;
    border-bottom:1px solid rgba(208,172,114,.48);
    background:transparent;
    color:#D9BC88;
    font-family:var(--serif);
    font-size:10.5px;
    font-weight:400;
    letter-spacing:.14em;
    cursor:pointer;
    opacity:0;
    animation:fadeIn 1s ease 1.85s forwards;
    transition:color .35s ease,border-color .35s ease;
  }
  .light::before{
    content:"";
    width:4px;height:4px;
    border:1px solid currentColor;
    transform:rotate(45deg);
    animation:pulseDot 2.8s ease-in-out infinite;
  }
  .light::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-1px;
    height:1px;
    background:var(--gold);
    transform:scaleX(0);
    transform-origin:50% 50%;
    transition:transform .5s var(--ease);
  }
  .light:hover::after,.light.tapped::after{transform:scaleX(1);}
  .light.tapped{color:#E7A780;border-color:rgba(231,167,128,.4);}
  @keyframes pulseDot{
    0%,100%{opacity:.45;transform:rotate(45deg) scale(.8);}
    50%{opacity:1;transform:rotate(45deg) scale(1);}
  }
  .light .btn-text{display:inline-block;transition:opacity .25s ease,transform .25s ease;}
  .light.swap .btn-text{opacity:0;transform:translateY(4px);}

  .seal{
    position:absolute;
    z-index:5;
    left:50%;
    bottom:-17px;
    width:38px;
    height:38px;
    margin-left:-19px;
    border-radius:50%;
    background:
      radial-gradient(circle at 34% 28%,#BB7157 0%,#9A533E 48%,#71392C 100%);
    border:1px solid rgba(232,211,170,.8);
    box-shadow:
      0 8px 16px rgba(0,0,0,.38),
      inset 0 1px 2px rgba(255,255,255,.28),
      inset 0 -4px 8px rgba(61,22,15,.3);
    opacity:0;
    animation:sealIn .8s var(--ease) 2s forwards;
  }
  .seal::before{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    border:1px dashed rgba(247,232,203,.42);
  }
  .seal svg{
    position:absolute;
    left:50%;top:50%;
    width:17px;height:17px;
    transform:translate(-50%,-50%);
    color:#F4DFC0;
    opacity:.9;
  }
  @keyframes sealIn{
    0%{opacity:0;transform:scale(.6) rotate(-12deg);}
    100%{opacity:1;transform:scale(1) rotate(0);}
  }

  /* ---------------- character ---------------- */
  .character{
    position:relative;
    z-index:6;
    width:min(88vw,370px,43vh);
    margin-top:auto;
    margin-bottom:16px;
    opacity:0;
    transform:translateY(30px);
    animation:charIn 1.7s var(--ease) .55s forwards;
  }
  @keyframes charIn{
    0%{opacity:0;transform:translateY(30px) scale(.965);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }

  .char-inner{
    position:relative;
    width:100%;
    transform-origin:50% 100%;
    animation:charFloat 7.5s ease-in-out 2.1s infinite;
  }
  @keyframes charFloat{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-5px) rotate(.2deg);}
  }
  .char-inner.pulse{animation:charPulse .95s var(--ease);}
  @keyframes charPulse{
    0%{transform:translateY(0) scale(1);}
    35%{transform:translateY(-4px) scale(1.015);}
    70%{transform:translateY(0) scale(.998);}
    100%{transform:translateY(0) scale(1);}
  }

  .halo{
    position:absolute;
    z-index:-1;
    left:50%;top:42%;
    width:82%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,211,145,.34) 0%,rgba(255,211,145,.12) 42%,rgba(255,211,145,0) 70%);
    filter:blur(20px);
    animation:haloBreathe 7s ease-in-out infinite;
  }
  @keyframes haloBreathe{
    0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.72;}
    50%{transform:translate(-50%,-50%) scale(1.05);opacity:1;}
  }

  .cloud-foot{
    position:absolute;
    z-index:-2;
    left:50%;bottom:-3%;
    width:112%;
    height:24%;
    transform:translateX(-50%);
    border-radius:50%;
    background:
      radial-gradient(ellipse at 28% 68%,rgba(205,221,228,.26) 0%,rgba(205,221,228,0) 54%),
      radial-gradient(ellipse at 70% 62%,rgba(205,221,228,.22) 0%,rgba(205,221,228,0) 55%),
      radial-gradient(ellipse at 50% 80%,rgba(236,224,195,.18) 0%,rgba(236,224,195,0) 62%);
    filter:blur(9px);
  }

  .character img{
    position:relative;
    z-index:2;
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 30px 34px rgba(0,0,0,.5)) drop-shadow(0 0 26px rgba(255,190,105,.13));
  }

  .char-shadow{
    position:absolute;
    z-index:0;
    left:50%;bottom:1.5%;
    width:56%;height:16px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.5) 0%,rgba(0,0,0,.2) 48%,rgba(0,0,0,0) 72%);
    filter:blur(5px);
    animation:shadowBreathe 7.5s ease-in-out 2.1s infinite;
  }
  @keyframes shadowBreathe{
    0%,100%{transform:translateX(-50%) scale(1);opacity:.9;}
    50%{transform:translateX(-50%) scale(.94);opacity:.65;}
  }

  .hand-light{
    position:absolute;
    z-index:3;
    left:88%;
    top:22%;
    width:26px;
    height:32px;
    transform-origin:50% 100%;
    animation:lanternSway 5.2s ease-in-out infinite;
  }
  .hand-light .lantern-glow{
    position:absolute;
    left:50%;top:50%;
    width:80px;height:80px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,205,126,.5) 0%,rgba(255,205,126,.14) 42%,rgba(255,205,126,0) 70%);
    filter:blur(8px);
    pointer-events:none;
  }
  .hand-light .lantern-body{
    position:absolute;
    left:50%;top:4px;
    width:20px;height:26px;
    transform:translateX(-50%);
    border-radius:8px 8px 5px 5px / 10px 10px 4px 4px;
    background:
      radial-gradient(ellipse at 50% 28%,rgba(255,255,240,.9) 0%,rgba(255,236,190,.35) 34%,rgba(255,214,150,0) 62%),
      linear-gradient(180deg,#FFEBC1 0%,#FFC987 52%,#EC8A50 100%);
    box-shadow:0 0 18px 6px rgba(255,185,111,.42),inset 0 1px 1px rgba(255,255,255,.75),inset 0 -5px 8px rgba(199,99,46,.16);
    border:1px solid rgba(255,225,170,.5);
  }
  .hand-light .lantern-body::before,.hand-light .lantern-body::after{
    content:"";
    position:absolute;
    left:50%;
    width:14px;height:1px;
    transform:translateX(-50%);
    background:rgba(233,192,122,.8);
  }
  .hand-light .lantern-body::before{top:2px;}
  .hand-light .lantern-body::after{bottom:2px;}
  .hand-light .lantern-string{
    position:absolute;
    left:50%;top:28px;
    width:1px;height:34px;
    background:linear-gradient(rgba(232,195,128,.8),rgba(232,195,128,.05));
    transform:translateX(-50%);
  }
  @keyframes lanternSway{
    0%,100%{transform:rotate(-2.5deg) translateY(0);}
    50%{transform:rotate(2.5deg) translateY(-3px);}
  }
  .hand-light.flare .lantern-glow{animation:flare .8s ease-out;}
  @keyframes flare{
    0%{transform:translate(-50%,-50%) scale(.8);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(2.2);opacity:0;}
  }

  .credit{
    position:fixed;
    z-index:11;
    left:50%;
    bottom:calc(5px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    color:rgba(230,215,190,.42);
    font-size:7px;
    letter-spacing:.05em;
    white-space:nowrap;
    pointer-events:none;
  }

  /* ---------------- flying lanterns ---------------- */
  .fx-layer{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden;}
  .fly-lantern{
    position:absolute;
    width:30px;height:40px;
    margin:0;
    animation:lanternFly 7.2s cubic-bezier(.22,.1,.3,1) forwards;
    will-change:transform,opacity;
  }
  .fly-lantern .body{
    position:absolute;
    left:3px;top:5px;
    width:24px;height:30px;
    border-radius:9px 9px 5px 5px / 12px 12px 4px 4px;
    background:
      radial-gradient(ellipse at 50% 28%,rgba(255,255,240,.95) 0%,rgba(255,236,190,.55) 22%,rgba(255,214,150,0) 55%),
      linear-gradient(180deg,#FFF4D6 0%,#FFD08C 46%,#EE9454 100%);
    border:1px solid rgba(255,235,190,.5);
    box-shadow:
      0 0 30px 11px rgba(255,175,96,.42),
      inset 0 1px 1px rgba(255,255,255,.8),
      inset 0 -6px 10px rgba(199,99,46,.16);
  }
  .fly-lantern .body::before,.fly-lantern .body::after{
    content:"";
    position:absolute;
    left:50%;
    width:18px;height:1px;
    transform:translateX(-50%);
    background:rgba(247,214,151,.8);
  }
  .fly-lantern .body::before{top:2px;}
  .fly-lantern .body::after{bottom:2px;}
  .fly-lantern .dot{
    position:absolute;
    left:50%;bottom:5px;
    width:5px;height:5px;
    border-radius:50%;
    background:#FFF6D6;
    transform:translateX(-50%);
    box-shadow:0 0 9px 3px rgba(255,232,170,.9);
  }
  @keyframes lanternFly{
    0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.55) rotate(0deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),-58vh) scale(1.06) rotate(var(--rot,6deg));}
  }

  .ripple-layer{position:fixed;inset:0;z-index:29;pointer-events:none;overflow:hidden;}
  .ripple{
    position:absolute;
    width:14px;height:14px;
    margin:-7px 0 0 -7px;
    border:1px solid rgba(240,210,156,.55);
    border-radius:50%;
    animation:rippleOut 1s var(--ease) forwards;
  }
  @keyframes rippleOut{
    0%{opacity:.8;transform:scale(.4);}
    100%{opacity:0;transform:scale(9);}
  }

  /* ---------------- responsive ---------------- */
  @media (max-height:800px) and (min-height:601px){
    .letter-wrap{margin-top:clamp(46px,6.6vh,62px);}
    .letter{padding:24px 26px 27px;}
    .title{font-size:clamp(47px,13.2vw,58px);}
    .character{width:min(88vw,350px,42vh);}
  }
  @media (max-height:740px){
    .letter-wrap{margin-top:38px;}
    .letter{padding:22px 22px 25px;}
    .name{font-size:23px;}
    .title{font-size:clamp(43px,13.8vw,54px);margin-top:5px;}
    .wish{font-size:11.8px;line-height:1.95;}
    .light{margin-top:12px;}
    .character{width:min(86vw,320px,41vh);margin-bottom:12px;}
    .seal{width:34px;height:34px;margin-left:-17px;bottom:-15px;}
    .seal svg{width:15px;height:15px;}
  }
  @media (max-height:620px){
    .topbar{font-size:7px;}
    .letter-wrap{margin-top:38px;}
    .letter{padding:18px 20px 22px;}
    .emblem{width:17px;height:17px;margin-bottom:7px;}
    .name{font-size:21px;}
    .title{font-size:clamp(38px,12.6vw,48px);}
    .wish{font-size:10.9px;line-height:1.85;letter-spacing:.1em;}
    .divider{height:17px;margin-top:3px;}
    .light{margin-top:9px;font-size:9.5px;}
    .character{width:min(80vw,290px,39vh);margin-bottom:10px;}
    .credit{font-size:6.5px;}
  }
  @media (max-height:540px){
    .letter-wrap{margin-top:38px;}
    .letter{padding:15px 18px 19px;}
    .title{font-size:clamp(35px,11.6vw,44px);}
    .wish{line-height:1.7;}
    .character{width:min(72vw,250px,36vh);}
  }
  @media (min-width:720px) and (min-height:820px){
    .letter-wrap{width:390px;margin-top:106px;}
    .character{width:min(410px,46vh);}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
    .topbar,.letter,.emblem,.name,.ch,.divider,.wish,.light,.seal,.character{opacity:1 !important;transform:none !important;}
    .moon{opacity:1 !important;}
    .shooting,.fly-lantern{display:none;}
  }
</style>
</head>

  }
  [[11,12,11],[86,17,8],[68,33,6]].forEach(function(a){
    var sp = document.createElement('span');
    sp.className = 'spark';
    sp.style.left = a[0] + '%';
    sp.style.top = a[1] + '%';
    sp.style.width = a[2] + 'px';
    sp.style.height = a[2] + 'px';
    sp.style.setProperty('--dur', (5 + Math.random()*3).toFixed(1) + 's');
    sp.style.setProperty('--delay', (-Math.random()*5).toFixed(1) + 's');
    starLayer.appendChild(sp);
  });

  /* ---------- fireflies ---------- */
  if(!reduced){
    for(var f=0; f<14; f++){
      var fly = document.createElement('span');
      fly.className = 'firefly';
      fly.style.left = (6 + Math.random()*88) + '%';
      fly.style.top = (28 + Math.random()*64) + '%';
      fly.style.setProperty('--dur', (8 + Math.random()*8).toFixed(1) + 's');
      fly.style.setProperty('--delay', (-Math.random()*12).toFixed(1) + 's');
      fly.style.setProperty('--dx', (-18 + Math.random()*36).toFixed(0) + 'px');
      fireflyLayer.appendChild(fly);
    }
  }

  /* ---------- shooting star ---------- */
  function shoot(){
    if(reduced || document.hidden) return;
    shooting.style.top = (6 + Math.random()*8) + '%';
    shooting.classList.remove('run');
    void shooting.offsetWidth;
    shooting.classList.add('run');
  }
  function scheduleShoot(){
    setTimeout(function(){
      shoot();
      scheduleShoot();
    }, 7000 + Math.random()*7000);
  }
  if(!reduced){
    setTimeout(function(){
      shoot();
      scheduleShoot();
    }, 3200);
  }

  /* ---------- lanterns ---------- */
  function makeLantern(x,y,delay){
    var el = document.createElement('div');
    el.className = 'fly-lantern';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.animationDelay = (delay || 0) + 'ms';
    el.style.setProperty('--dx', (-50 + Math.random()*100).toFixed(0) + 'px');
    el.style.setProperty('--rot', (-12 + Math.random()*24).toFixed(0) + 'deg');
    el.innerHTML = '<span class="body"><span class="dot"></span></span>';
    fxLayer.appendChild(el);
    setTimeout(function(){ el.remove(); }, 7000);
  }

  function ripple(x,y){
    var r = document.createElement('span');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    rippleLayer.appendChild(r);
    setTimeout(function(){ r.remove(); }, 1050);
  }

  function release(n){
    if(reduced) return;
    var baseY = window.innerHeight * .96;
    for(var i=0;i<n;i++){
      var x = window.innerWidth * (.12 + Math.random()*.76);
      makeLantern(x, baseY + Math.random()*30, i*130);
    }
  }

  /* ---------- interaction ---------- */
  var tapped = false;
  function tap(x,y,isButton){
    ripple(x,y);
    if(!reduced){
      release(isButton ? 4 : 1);
      handLight.classList.remove('flare');
      void handLight.offsetWidth;
      handLight.classList.add('flare');
      charInner.classList.remove('pulse');
      void charInner.offsetWidth;
      charInner.classList.add('pulse');
      setTimeout(function(){ charInner.classList.remove('pulse'); }, 1000);
    }
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} }

    if(!tapped){
      tapped = true;
      lightBtn.classList.add('swap');
      setTimeout(function(){
        btnText.textContent = '晚安，孟棋棋';
        lightBtn.classList.remove('swap');
        lightBtn.classList.add('tapped');
      }, 240);
    }
  }

  stage.addEventListener('pointerdown', function(e){
    if(e.button && e.button !== 0) return;
    tap(e.clientX, e.clientY, !!e.target.closest('.light'));
  }, {passive:true});

  lightBtn.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      var r = lightBtn.getBoundingClientRect();
      tap(r.left + r.width/2, r.top + r.height/2, true);
    }
  });
})();
</script>
</body>
</html>
