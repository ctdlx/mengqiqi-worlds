<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2ECDD">
<meta name="robots" content="noindex, nofollow">
<title>孟棋棋 · 三个小世界</title>
<meta name="description" content="给孟棋棋的三个页面方向，点开看看。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F2ECDD'/%3E%3Cpath d='M32 10l5 15 16 1-13 10 5 16-13-10-13 10 5-16-13-10 16-1z' fill='%23B08A4F'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F2ECDD;
    --paper:#FCF7EC;
    --ink:#382C22;
    --muted:#7A6A58;
    --line:rgba(92,74,52,.16);
    --serif:'Songti SC','STSong','Noto Serif SC','Noto Serif CJK SC','SimSun',serif;
    --sans:'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    background:
      radial-gradient(70% 50% at 78% 0%,rgba(255,250,232,.9) 0%,rgba(255,250,232,0) 62%),
      linear-gradient(180deg,#F5EFE1 0%,#F2ECDD 55%,#EDE5D4 100%);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .page{
    width:100%;
    max-width:1080px;
    margin:0 auto;
    padding:calc(22px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    color:#927C62;
    font-family:var(--serif);
    font-size:8px;
    letter-spacing:.32em;
    text-transform:uppercase;
  }
  header .brand{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  header .brand::before{
    content:"";
    width:5px;height:5px;
    border:1px solid #B08A4F;
    transform:rotate(45deg);
  }
  header .for{white-space:nowrap;}

  .intro{
    margin:clamp(54px,9vh,104px) 0 clamp(30px,4vh,44px);
  }
  .eyebrow{
    margin:0;
    color:#A08A6D;
    font-family:var(--serif);
    font-size:9px;
    letter-spacing:.34em;
    text-transform:uppercase;
  }
  h1{
    margin:12px 0 10px;
    max-width:820px;
    font-family:var(--serif);
    font-size:clamp(36px,5.4vw,60px);
    font-weight:650;
    line-height:1.25;
    letter-spacing:.025em;
    color:#33281F;
  }
  .sub{
    margin:0;
    color:var(--muted);
    font-family:var(--serif);
    font-size:clamp(12px,1.6vw,14px);
    letter-spacing:.08em;
    line-height:1.8;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:24px;
  }
  .option{
    position:relative;
    display:block;
    padding:12px 12px 14px;
    border:1px solid var(--line);
    border-radius:3px;
    background:rgba(255,251,242,.72);
    color:inherit;
    text-decoration:none;
    box-shadow:0 18px 36px -26px rgba(70,55,38,.38);
    transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease,border-color .45s ease;
  }
  .option::after{
    content:"";
    position:absolute;
    left:12px;right:12px;bottom:0;
    height:2px;
    background:var(--accent);
    opacity:.7;
    transform:scaleX(0);
    transform-origin:0 50%;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .option:hover{
    transform:translateY(-5px);
    border-color:rgba(92,74,52,.28);
    box-shadow:0 28px 48px -28px rgba(70,55,38,.45);
  }
  .option:hover::after{transform:scaleX(1);}
  .thumb{
    position:relative;
    aspect-ratio:300/460;
    overflow:hidden;
    border-radius:2px;
    background:#E8E0D1;
    box-shadow:inset 0 0 0 1px rgba(70,55,38,.08);
  }
  .thumb img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
    object-position:top center;
    transition:transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .option:hover .thumb img{transform:scale(1.025);}
  .no{
    position:absolute;
    z-index:2;
    top:12px;left:12px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:28px;
    height:22px;
    padding:0 8px;
    border-radius:999px;
    background:rgba(255,250,239,.9);
    color:var(--accent);
    font-family:var(--serif);
    font-size:8px;
    letter-spacing:.16em;
    text-indent:.16em;
    box-shadow:0 5px 12px rgba(60,45,30,.14);
    backdrop-filter:blur(4px);
  }
  .meta{padding:13px 4px 2px;}
  .meta h2{
    margin:0 0 6px;
    font-family:var(--serif);
    font-size:20px;
    font-weight:650;
    letter-spacing:.03em;
    color:#3A2D22;
  }
  .meta p{
    margin:0 0 12px;
    font-family:var(--serif);
    font-size:11.5px;
    line-height:1.7;
    letter-spacing:.05em;
    color:var(--muted);
  }
  .go{
    display:inline-block;
    color:var(--accent);
    font-family:var(--serif);
    font-size:9px;
    letter-spacing:.22em;
    text-indent:.22em;
    text-transform:uppercase;
  }
  .night{--accent:#314A66;}
  .garden{--accent:#70815F;}
  .theater{--accent:#7A2B33;}

  footer{
    margin-top:clamp(42px,7vh,70px);
    padding-top:18px;
    border-top:1px solid rgba(92,74,52,.12);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    color:#9B876D;
    font-size:7.5px;
    letter-spacing:.12em;
  }
  footer .right{font-family:var(--serif);letter-spacing:.22em;}

  @media (max-width:760px){
    .page{padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));}
    header{font-size:7px;letter-spacing:.24em;}
    .intro{margin:clamp(42px,7vh,70px) 0 24px;}
    .eyebrow{font-size:8px;}
    h1{font-size:clamp(30px,8.4vw,42px);margin:9px 0 8px;}
    .sub{font-size:11.5px;}
    .grid{display:flex;flex-direction:column;gap:13px;}
    .option{display:flex;align-items:center;gap:14px;padding:10px;border-radius:3px;}
    .option::after{left:10px;right:10px;}
    .thumb{width:104px;flex:0 0 104px;aspect-ratio:300/460;border-radius:2px;}
    .no{top:8px;left:8px;min-width:24px;height:19px;font-size:7px;padding:0 6px;}
    .meta{padding:0;flex:1;min-width:0;}
    .meta h2{font-size:18px;margin-bottom:4px;}
    .meta p{font-size:10.5px;line-height:1.65;margin-bottom:9px;}
    .go{font-size:8.5px;}
    footer{margin-top:34px;font-size:6.8px;}
  }
  @media (max-width:360px){
    .thumb{width:92px;flex-basis:92px;}
    .meta h2{font-size:17px;}
    .meta p{font-size:10px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="brand">NAILOONG</span>
    <span class="for">FOR 孟棋棋</span>
  </header>

  <section class="intro">
    <p class="eyebrow">THREE LITTLE WORLDS</p>
    <h1>孟棋棋的三个小世界</h1>
    <p class="sub">三个方向，点开看看，选一个你喜欢的。</p>
  </section>

  <main class="grid">
    <a class="option night" href="night/">
      <div class="thumb">
        <span class="no">01</span>
        <img src="thumbs/night.jpg" alt="星月夜航页面预览" loading="lazy">
      </div>
      <div class="meta">
        <h2>星月夜航</h2>
        <p>月亮、夜风和一盏灯</p>
        <span class="go">打开 →</span>
      </div>
    </a>

    <a class="option garden" href="garden/">
      <div class="thumb">
        <span class="no">02</span>
        <img src="thumbs/garden.jpg" alt="春日花园页面预览" loading="lazy">
      </div>
      <div class="meta">
        <h2>春日花园</h2>
        <p>花、风和一只路过的蝴蝶</p>
        <span class="go">打开 →</span>
      </div>
    </a>

    <a class="option theater" href="theater/">
      <div class="thumb">
        <span class="no">03</span>
        <img src="thumbs/theater.jpg" alt="小小剧院页面预览" loading="lazy">
      </div>
      <div class="meta">
        <h2>小小剧院</h2>
        <p>灯光亮起，今晚你是主角</p>
        <span class="go">打开 →</span>
      </div>
    </a>
  </main>

  <footer>
    <span>奶龙 Nailoong © 第七印象</span>
    <span class="right">PICK A WORLD</span>
  </footer>
</div>
</body>
</html>
